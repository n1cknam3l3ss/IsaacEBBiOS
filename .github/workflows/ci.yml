name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacEnhancedBossBarsiOS.dylib
          test -f packages/IsaacEnhancedBossBarsiOS-rootless.deb
          test -f packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
          test -f dist/IsaacEnhancedBossBarsiOS.zip
          otool -L build/IsaacEnhancedBossBarsiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacEnhancedBossBarsiOS-Build
          path: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Isaac Enhanced Boss Bars iOS v1.0.5"
          body: |
            ## The Binding of Isaac: Enhanced Boss Bars for iOS (v1.0.5)

            Standalone native port of the popular Steam Workshop mod **Enhanced Boss Bars** for The Binding of Isaac: Repentance on iOS.

            ### What's New in v1.0.5:
            - **Beast Arena Background Entity Fix**: Filtered out Isaac's background silhouette entities (`Variants 100..104` and sub-parts `2, 3, 11, etc.`), eliminating duplicate stacked Beast bars.
            - **Sequential Beast Fight Support**: During the entire Beast encounter, exactly one active boss bar is displayed at a time (Ultra Famine -> Ultra Pestilence -> Ultra War -> Ultra Death -> The Beast) featuring the authentic volcanic Beast bar style and fire overlay.
            - **Dogma Phase 1 HP Tracking**: Fixed invulnerability bug by correctly targeting Dogma's TV (`Variant 1`) instead of the cord baby (`Variant 0`), allowing Phase 1 HP to properly drain as damage is dealt.
            - **Dogma Phase 2 Angel Wings Icon**: Fixed icon animation update so Dogma Phase 2 cleanly transitions to the animated winged angel portrait instead of stretching the TV frame.
            - **Accurate Entity Status Bitmask**: Corrected entity status flags offset to `0x560` (Isaac arm64 engine address), eliminating spurious charm heart badges and accurately displaying poison, burn, freeze, and slow effects.

            ### Installation:
            - **LiveContainer / Jailed**:
              Download `IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip`, open LiveContainer, select your Isaac app, tap **Tweaks** -> **+** and choose the downloaded file.
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacEnhancedBossBarsiOS-rootless.deb`.
          files: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
