name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacEnhancedBossBarsiOS.dylib
          test -f packages/IsaacEnhancedBossBarsiOS-rootless.deb
          test -f packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
          test -f dist/IsaacEnhancedBossBarsiOS.zip
          otool -L build/IsaacEnhancedBossBarsiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacEnhancedBossBarsiOS-Build
          path: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Isaac Enhanced Boss Bars iOS v1.0.8"
          body: |
            ## The Binding of Isaac: Enhanced Boss Bars for iOS (v1.0.8)

            Standalone native port of the popular Steam Workshop mod **Enhanced Boss Bars** for The Binding of Isaac: Repentance on iOS.

            ### What's New in v1.0.8:
            - **Strict Boss Room Filtering**: Boss bars are now exclusively displayed in rooms that host boss encounters (Boss rooms, Boss Rush, Mini-boss rooms, Challenge rooms). Regular exploration rooms (spiders, mulligans, wandering mobs) no longer render any boss bars.
            - **Segmented Worm Boss HP Merging**: Segmented bosses like Larry Jr, Chub, Chad, Carrion Queen, Pin, Scolex, Frail, Wormwood, and Turdlet now automatically sum the HP and MaxHP of all their body/tail segments into a single unified health bar instead of cluttering the screen with 4-8 separate bars.
            - **Gemini & Blighted Ovum Fixes**: Eliminated duplicate health bars caused by Gemini's umbilical cord tether segments. Filtered out Blighted Ovum's invincible ghost baby.
            - **Non-Boss Helper & Projectile Filtering**: Prevented Little Horn black hole spheres and Big Horn sub-entities from generating boss bars.
            - **Disabled Broken Status Effect Badges**: Removed the static row of fake status badges (poison, freeze, charm, etc.) caused by unverified bitfield offsets.
            - **Exact (Type, Variant) Matching**: Removed loose fallback matching in boss definitions to ensure only genuine bosses get custom bars.

            ### Installation:
            - **LiveContainer / Jailed**:
              Download `IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip`, open LiveContainer, select your Isaac app, tap **Tweaks** -> **+** and choose the downloaded file.
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacEnhancedBossBarsiOS-rootless.deb`.
          files: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
