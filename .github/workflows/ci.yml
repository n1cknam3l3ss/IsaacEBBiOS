name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacEnhancedBossBarsiOS.dylib
          test -f packages/IsaacEnhancedBossBarsiOS-rootless.deb
          test -f packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
          test -f dist/IsaacEnhancedBossBarsiOS.zip
          otool -L build/IsaacEnhancedBossBarsiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacEnhancedBossBarsiOS-Build
          path: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Isaac Enhanced Boss Bars iOS v1.0.6"
          body: |
            ## The Binding of Isaac: Enhanced Boss Bars for iOS (v1.0.6)

            Standalone native port of the popular Steam Workshop mod **Enhanced Boss Bars** for The Binding of Isaac: Repentance on iOS.

            ### What's New in v1.0.6:
            - **No Bars in Cutscenes & Death Animations**: Now checks `FLAG_DONT_COUNT_BOSS_HP` (`1ULL << 31`) and `FLAG_BOSSDEATH_TRIGGERED` (`1ULL << 20`) so boss bars immediately vanish when a boss dies or when cutscenes trigger.
            - **Full Double Trouble Support**: Fixed deduplication bug that previously dropped identical boss types. Double Haunt, Double Monstro, and dual boss encounters now properly display both boss bars.
            - **Dynamic Horizontal Multi-Bar Layout**: Multiple boss bars are now placed side-by-side on a single horizontal row at the bottom and dynamically scaled (scale 1.25 for 2 bosses, 0.98 for 3 bosses, 0.82 for 4 bosses) to take minimal vertical space and prevent obscuring the gameplay arena.
            - **Mega Satan Multi-Part Bars**: Mega Satan Head, Left Hand, and Right Hand now each have their own independent HP bars displayed side-by-side in natural visual order.
            - **Delirium Isolation**: When fighting Delirium (`Type 412`), all other boss types/transformations are suppressed so no spurious extra boss bars spawn.
            - **Beast Fight Pre-Engagement Fix**: Prevented The Beast's bar from appearing during the arena intro while swimming in the background (`Variants 100..104`). The bar only appears once Ultra Harbingers actually engage, and The Beast's bar emerges after Death is defeated.
            - **Instant Damage Flash**: Removed the lagging delayed decaying soulslike bar. Boss bars now flash bright white upon taking damage with crisp immediate HP updates, matching the PC mod and vanilla Isaac.
            - **Prominent Status Effect Badges**: Moved status badges to float directly along the top border of the HP bar with high-contrast drop shadows, clearly showing poison, burn, freeze, slow, fear, charm, confusion, and more.

            ### Installation:
            - **LiveContainer / Jailed**:
              Download `IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip`, open LiveContainer, select your Isaac app, tap **Tweaks** -> **+** and choose the downloaded file.
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacEnhancedBossBarsiOS-rootless.deb`.
          files: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
