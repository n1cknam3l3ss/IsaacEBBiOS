name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacEnhancedBossBarsiOS.dylib
          test -f packages/IsaacEnhancedBossBarsiOS-rootless.deb
          test -f packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
          test -f dist/IsaacEnhancedBossBarsiOS.zip
          otool -L build/IsaacEnhancedBossBarsiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacEnhancedBossBarsiOS-Build
          path: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "Isaac Enhanced Boss Bars iOS v1.0.3"
          body: |
            ## The Binding of Isaac: Enhanced Boss Bars for iOS (v1.0.3)

            Standalone native port of the popular Steam Workshop mod **Enhanced Boss Bars** for The Binding of Isaac: Repentance on iOS.

            ### What's New in v1.0.3:
            - **Animated Dogma Static**: Dogma's HP bar and TV portrait now actively flicker with authentic animated TV static! Dogma Angel wings are properly sliced and animated.
            - **Ultra Harbingers & Beast Room**: Full support for Ultra Famine, Ultra Pestilence, Ultra War, and Ultra Death during the Beast fight without getting overshadowed by The Beast.
            - **Seamless Boss Portrait Layout**: Eliminated the gap between boss portrait and health bar frame, connecting them into a single unified graphic.
            - **Live Status Effect Badges**: Corrected Isaac Repentance entity status flags — Poison droplet, Burn flame, Freeze snowflake, Charm, Slow, and Fear now render clearly to the left of the boss portrait.
            - **Complete Vanilla Bar Removal**: Included transparent 1x1 replacements for all 4 vanilla bar textures (`ui_bosshealthbar.png`, `ui_bosshealthbar_static.png`, `ui_bosshealthbar_stone.png`, `ui_bosshealthbar_mini.png`).

            ### Installation:
            - **LiveContainer / Jailed**:
              Download `IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip`, open LiveContainer, select your Isaac app, tap **Tweaks** -> **+** and choose the downloaded file.
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacEnhancedBossBarsiOS-rootless.deb`.
          files: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
