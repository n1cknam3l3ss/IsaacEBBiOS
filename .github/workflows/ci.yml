name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacEnhancedBossBarsiOS.dylib
          test -f packages/IsaacEnhancedBossBarsiOS-rootless.deb
          test -f packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
          test -f dist/IsaacEnhancedBossBarsiOS.zip
          otool -L build/IsaacEnhancedBossBarsiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacEnhancedBossBarsiOS-Build
          path: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "Isaac Enhanced Boss Bars iOS v1.0.9"
          body: |
            ## The Binding of Isaac: Enhanced Boss Bars for iOS (v1.0.9)

            Standalone native port of the popular Steam Workshop mod **Enhanced Boss Bars** for The Binding of Isaac: Repentance on iOS.

            ### What's New in v1.0.9:
            - **Live Wi-Fi Debug Server (port 8765)**: Integrated embedded wireless HTTP server on `http://<device_ip>:8765` providing real-time JSON snapshots (`/status`) and event stream (`/log`) of all boss memory fields (`0x560`, `0x1B8`, memory chunks).
            - **Live HUD Banner**: Added on-screen live banner above the boss bars showing the device's local Wi-Fi IP and active `0x560` bitmask in real time.
            - **Live Status Effect Badges for Verified Bits**: Status badges (Poison, Burn, Slow, Charm, Confusion, Fear, Bleed out) now trigger based on verified ARM64 engine bit positions (6, 12, 7, 8, 9, 11, 34).
            - **All v1.0.8 Fixes Retained**: Boss room filtering, segmented worm boss unification, Gemini & Blighted Ovum deduplication, and Chest/Dark Room support.

            ### Installation:
            - **LiveContainer / Jailed**:
              Download `IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip`, open LiveContainer, select your Isaac app, tap **Tweaks** -> **+** and choose the downloaded file.
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacEnhancedBossBarsiOS-rootless.deb`.
          files: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
