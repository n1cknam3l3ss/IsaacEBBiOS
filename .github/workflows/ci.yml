name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacEnhancedBossBarsiOS.dylib
          test -f packages/IsaacEnhancedBossBarsiOS-rootless.deb
          test -f packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
          test -f dist/IsaacEnhancedBossBarsiOS.zip
          otool -L build/IsaacEnhancedBossBarsiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacEnhancedBossBarsiOS-Build
          path: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "Isaac Enhanced Boss Bars iOS v1.1.2"
          body: |
            ## The Binding of Isaac: Enhanced Boss Bars for iOS (v1.1.2)

            Standalone native port of the popular Steam Workshop mod **Enhanced Boss Bars** for The Binding of Isaac: Repentance on iOS.

            ### What's New in v1.1.2:
            - **Expanded Boss Encounter Rooms**: Added boss bar support for Krampus in Devil Deals (roomType 14), Greed & Super Greed in Shops (roomType 2) and Secret/Super Secret/Ultra Secret rooms (roomType 7, 8, 29), and Angel fights in Angel/Sacrifice rooms (roomType 13, 15).
            - **Late-Game Floor Normal Rooms**: Bosses appearing in normal rooms (roomType 1) across Womb 1 & 2 / Utero / Scarred Womb / Corpse (stages 7, 8), Sheol & Cathedral (stage 10), Chest & Dark Room (stage 11), and The Void (stage 12) now display full boss bars!
            - **Strict Status Badges & Clean HUD Retained**: Zero false-positive status indicators and authentic pixel-perfect display.
            - **All Boss Logic Retained**: Boss room restriction, segmented worm HP merging (Larry Jr, Chub, Pin), Gemini/Blighted Ovum deduplication, and Chest / Dark Room compatibility.

            ### Installation:
            - **LiveContainer / Jailed**:
              Download `IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip`, open LiveContainer, select your Isaac app, tap **Tweaks** -> **+** and choose the downloaded file.
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacEnhancedBossBarsiOS-rootless.deb`.
          files: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
