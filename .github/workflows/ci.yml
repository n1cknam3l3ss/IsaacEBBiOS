name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build Tweak
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacEnhancedBossBarsiOS.dylib
          test -f packages/IsaacEnhancedBossBarsiOS-rootless.deb
          test -f packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
          test -f dist/IsaacEnhancedBossBarsiOS.zip
          otool -L build/IsaacEnhancedBossBarsiOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacEnhancedBossBarsiOS-Build
          path: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "Isaac Enhanced Boss Bars iOS v1.0.7"
          body: |
            ## The Binding of Isaac: Enhanced Boss Bars for iOS (v1.0.7)

            Standalone native port of the popular Steam Workshop mod **Enhanced Boss Bars** for The Binding of Isaac: Repentance on iOS.

            ### What's New in v1.0.7:
            - **Hidden During Intro "VS" Splash Screens & Cinematics**: Boss bars are now completely hidden during the intro VS splash animations (e.g., "Isaac VS It Lives", "Isaac VS Dogma") and active in-game cutscene events. Bars now appear precisely when actual room gameplay begins and Isaac can move.
            - **Engine State Checks**: Added reads for `Game + 0x25810` (VersusScreen active state), `Game + 0x10d45a` (active gameplay flag), and `Game + 0x21560` (cutscene event) matching the game engine's internal HUD render suppression logic.
            - **All v1.0.6 Features Retained**: Full horizontal multi-bar layout, dynamic scaling, Double Trouble deduplication, Mega Satan multi-parts, Delirium isolation, Beast sequence handling, instant damage flashing, and floating status effect badges.

            ### Installation:
            - **LiveContainer / Jailed**:
              Download `IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip`, open LiveContainer, select your Isaac app, tap **Tweaks** -> **+** and choose the downloaded file.
            - **Jailbreak (Dopamine / Sileo / ElleKit)**:
              Install `IsaacEnhancedBossBarsiOS-rootless.deb`.
          files: |
            build/IsaacEnhancedBossBarsiOS.dylib
            packages/IsaacEnhancedBossBarsiOS-rootless.deb
            packages/IsaacEnhancedBossBarsiOS-LiveContainer.framework.zip
            dist/IsaacEnhancedBossBarsiOS.zip
